name: Tests

# THE INVARIANTS THAT MUST NEVER REGRESS, run against the REAL server on every
# push and pull request.
#
# Two jobs, deliberately:
#   fence  — the reference-record fence (node:test). Fast, and the one that
#            most often catches a real regression, so it runs alone and first.
#   suites — the end-to-end suites in test/legacy that boot their own server
#            and drive real endpoints (test/suites.json, tier "ci").
#
# A red run here blocks nothing by itself — the branch deploys straight to
# Railway — so treat a failure as "do not deploy", and read the job log.
#
# The BROWSER suites (br-*.js) are NOT in CI yet: they need Chromium and each
# takes minutes. Run them on demand with `npm run test:browser`. Week 1 of
# docs/IMPROVEMENT_PLAN.md records why, and what is left to wire.

on:
  pull_request: {}
  push:
    branches:
      - main
      - master
      - claude/ecommerce-order-dashboard-cxMNo
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fence:
    name: Reference-record fence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Drives the API only; no browser is launched, so the postinstall
      # Chromium download is skipped to keep the job quick.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 sharp
      - run: npm test

  suites:
    name: End-to-end suites
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm rebuild better-sqlite3 sharp
      - run: npm run test:suites

# NOTHING IN THIS FILE LAUNCHES A BROWSER, deliberately.
#
# The first cut of the suites job put web-note-e2e and lag-e2e in CI and
# installed Chromium for them — and it went red, while both were green on
# every machine here. Two faults, one of them a plain contradiction:
# PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD was set on the same job that then ran
# `playwright install chromium`, so the install is a no-op and the resolved
# executablePath points at nothing.
#
# The real fault was the classification. Those two LAUNCH Chromium (the ZORT
# web-label worker signs in and captures a PDF), so they are browser suites
# whatever else they assert, and calling them API suites is what dragged a
# browser install into a job that needs none. They are `browser: true` now
# and run with the other 14 on `npm run test:browser`.
#
# CI is therefore pure Node: 6 suites, 158 checks, no browser, no apt. That
# is 44 fewer checks than the first cut claimed and 158 more than ran before
# this week — and unlike 202 it is a number that actually runs.
