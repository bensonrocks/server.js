<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IDEALONE — Client Portal</title>
<style>
  :root { --bg:#f1f5f9; --surface:#fff; --border:#e2e8f0; --text:#0f172a; --muted:#64748b; --primary:#2563eb; --ok:#059669; --warn:#d97706; --bad:#dc2626; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
  .hidden { display:none !important; }
  /* login */
  .login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
  .login-box { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:1.6rem 1.3rem; width:100%; max-width:380px; box-shadow:0 8px 30px rgba(2,6,23,.08); }
  .brand { font-weight:800; letter-spacing:.02em; font-size:1.15rem; }
  .brand small { display:block; color:var(--muted); font-weight:600; font-size:.78rem; margin-top:.15rem; }
  label { display:block; font-size:.75rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin:.9rem 0 .3rem; }
  input { width:100%; padding:.8rem .9rem; border:1.5px solid var(--border); border-radius:10px; font-size:1rem; }
  input:focus { outline:none; border-color:var(--primary); }
  .btn { width:100%; padding:.9rem; border:0; border-radius:10px; font-size:1rem; font-weight:700; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .btn-primary { background:var(--primary); color:#fff; margin-top:1.1rem; }
  .err { color:var(--bad); font-size:.85rem; margin-top:.7rem; min-height:1.2em; }
  /* app shell */
  header { position:sticky; top:0; z-index:10; background:var(--surface); border-bottom:1px solid var(--border); padding:.7rem 1rem; display:flex; align-items:center; gap:.6rem; }
  header .who { flex:1; min-width:0; }
  header .who b { display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .who small { color:var(--muted); }
  .link { background:none; border:0; color:var(--primary); font-weight:700; cursor:pointer; font-size:.85rem; }
  nav { display:flex; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:52px; z-index:9; }
  nav button { flex:1; padding:.75rem .2rem; background:none; border:0; border-bottom:3px solid transparent; font-weight:700; color:var(--muted); font-size:.86rem; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  nav button.active { color:var(--primary); border-bottom-color:var(--primary); }
  main { padding: .9rem; max-width:900px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; }
  .tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.85rem .9rem; }
  .tile .v { font-size:1.5rem; font-weight:800; }
  .tile .l { font-size:.7rem; color:var(--muted); font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:.8rem .9rem; margin-bottom:.6rem; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:.5rem; }
  .muted { color:var(--muted); font-size:.8rem; }
  .pill { display:inline-block; padding:.15rem .55rem; border-radius:999px; font-size:.72rem; font-weight:800; }
  .p-done { background:#dcfce7; color:#166534; } .p-open { background:#fef3c7; color:#92400e; } .p-bad { background:#fee2e2; color:#991b1b; }
  .search { width:100%; padding:.7rem .9rem; border:1.5px solid var(--border); border-radius:10px; font-size:.95rem; margin-bottom:.7rem; }
  .empty { text-align:center; color:var(--muted); padding:2.2rem 0; }
  .mono { font-family:ui-monospace,Menlo,monospace; }
  .updated { text-align:center; color:var(--muted); font-size:.72rem; margin:.8rem 0 1.4rem; }
</style>
</head>
<body>

<div id="loginView" class="login-wrap">
  <div class="login-box">
    <div class="brand">▮▮ IDEALONE <small>Client Portal — your stock &amp; orders, live</small></div>
    <label>Client name</label>
    <input id="liClient" autocomplete="username" placeholder="e.g. Glowverse">
    <label>Password</label>
    <input id="liPass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn btn-primary" id="liBtn">Sign in</button>
    <div class="err" id="liErr"></div>
  </div>
</div>

<div id="appView" class="hidden">
  <header>
    <div class="who"><b id="whoName">—</b><small>Client Portal</small></div>
    <button class="link" id="refreshBtn">↻ Refresh</button>
    <button class="link" id="logoutBtn">Sign out</button>
  </header>
  <nav>
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="stock">Stock</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="inbound">Inbound</button>
  </nav>
  <main>
    <section id="tab-overview">
      <div class="grid" id="ovTiles"></div>
      <div class="updated" id="ovUpdated"></div>
    </section>
    <section id="tab-stock" class="hidden">
      <input class="search" id="stSearch" placeholder="Search SKU / name…">
      <div id="stList"></div>
    </section>
    <section id="tab-orders" class="hidden">
      <input class="search" id="orSearch" placeholder="Search order no…">
      <div id="orList"></div>
    </section>
    <section id="tab-inbound" class="hidden">
      <div id="ibList"></div>
    </section>
  </main>
</div>

<script src="/portal.js"></script>
</body>
</html>
