<!doctype html><html><head><meta charset="utf-8"><title>IdealOne — Surveillance</title>
<meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;max-width:960px;margin:1.5rem auto;padding:0 1rem;color:#222}
input,button{font:inherit;padding:.35rem .5rem}table{border-collapse:collapse;width:100%;margin:.5rem 0}
td,th{border:1px solid #ddd;padding:.3rem .5rem;text-align:left;font-size:14px}.muted{color:#777}
section{border:1px solid #e3e3e3;border-radius:8px;padding:1rem;margin:1rem 0}.hidden{display:none}</style></head>
<body><h1>&#127909; Surveillance</h1><p id="msg" class="muted"></p>
<section><h2>Find packing video</h2>
<form id="f"><input id="q" placeholder="Order / GI / tracking number" size="32"> <button>Search</button></form>
<div id="out"></div></section>
<section id="admin" class="hidden"><h2>Settings (Administrator)</h2>
<label><input type="checkbox" id="en"> Enabled globally</label><br>
Granted users (login IDs, comma separated): <input id="gu" size="40"><br>
Padding before/after (s): <input id="pb" size="4"> / <input id="pa" size="4"> <button id="saveS">Save</button>
<p>Recorder key: <span id="rk"></span> <button id="rot">Generate new key</button></p>
<h3>Cameras</h3><table id="cams"></table>
<form id="cf">Name <input name="name"> Station <input name="station" placeholder="PACKING STATION 4"><br>
RTSP URL <input name="rtspUrl" size="40" placeholder="rtsp://user:pass@192.168.1.20:554/stream1"><br>
Recordings folder <input name="folder" size="30"> File-name pattern <input name="filePattern" value="YYYY-MM-DD HH-mm-ss">
TZ <input name="tz" value="+08:00" size="6"> Clock offset (s) <input name="clockOffsetSec" value="0" size="4">
<button>Add / update camera</button></form></section>
<script>
const T=localStorage.getItem('wms_token')||'';const H={'x-auth-token':T,'Content-Type':'application/json'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>t?new Date(t).toLocaleString('en-SG',{timeZone:'Asia/Singapore'})+' SGT':'—';
async function api(m,p,b){const r=await fetch(p,{method:m,headers:H,body:b?JSON.stringify(b):undefined});return{ok:r.ok,j:await r.json().catch(()=>({}))}}
async function boot(){const s=await api('GET','/api/surveillance/status');
 if(!s.j.visible){document.body.innerHTML='<p>Surveillance is not enabled for this login.</p>';return}
 if(s.j.admin){document.getElementById('admin').classList.remove('hidden');loadS()}}
async function loadS(){const {j}=await api('GET','/api/surveillance/settings');en.checked=j.enabled;gu.value=(j.grantedUsers||[]).join(',');
 pb.value=j.padBeforeSec;pa.value=j.padAfterSec;rk.textContent=j.recorderKeySet?'set ('+j.recorderKeyHint+')':'not set';
 cams.innerHTML='<tr><th>Name</th><th>Station</th><th>RTSP</th><th>Folder</th><th>Pattern</th><th>Offset</th><th></th></tr>'+j.cameras.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.station)}</td><td>${esc(c.rtspUrl)}</td><td>${esc(c.folder)}</td><td>${esc(c.filePattern)} ${esc(c.tz)}</td><td>${esc(c.clockOffsetSec)}s</td><td><button data-del="${esc(c.id)}">Delete</button></td></tr>`).join('')}
saveS.onclick=async()=>{await api('PUT','/api/surveillance/settings',{enabled:en.checked,grantedUsers:gu.value.split(',').map(s=>s.trim()).filter(Boolean),padBeforeSec:+pb.value,padAfterSec:+pa.value});loadS()};
rot.onclick=async()=>{if(!confirm('Replace the recorder key? The local agent must be updated.'))return;const {j}=await api('POST','/api/surveillance/recorder-key');prompt('New recorder key (shown once):',j.recorderKey);loadS()};
cams.onclick=async e=>{const id=e.target.dataset.del;if(id&&confirm('Delete camera?')){await api('DELETE','/api/surveillance/cameras/'+id);loadS()}};
cf.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(cf));const r=await api('POST','/api/surveillance/cameras',b);msg.textContent=r.ok?'Camera saved':r.j.error;cf.rtspUrl.value='';loadS()};
f.onsubmit=async e=>{e.preventDefault();const {ok,j}=await api('GET','/api/surveillance/lookup?q='+encodeURIComponent(q.value));
 if(!ok){out.textContent=j.error;return} if(!j.results.length){out.textContent='No matching order.';return}
 out.innerHTML=j.results.map(r=>`<table><tr><th>Order</th><td>${esc(r.order)} ${esc(r.waybill)} (${esc(r.client)})</td></tr>
 <tr><th>Station / packer</th><td>${esc(r.operatorName||r.operator||'—')}</td></tr>
 <tr><th>Pack start → end</th><td>${fmt(r.startTime)} → ${fmt(r.endTime)}</td></tr>
 <tr><th>Window (−${r.padBeforeSec}s / +${r.padAfterSec}s)</th><td>${fmt(r.windowStart)} → ${fmt(r.windowEnd)}</td></tr>
 <tr><th>Recording</th><td>${r.videos.length?r.videos.map(v=>`<b>${esc(v.camera)}</b>: ${esc(v.folder)}${v.folder?'/':''}${esc(v.fileName)} — seek to <b>${esc(v.seekHms)}</b> (${v.seekSec}s), watch ${v.clipLengthSec}s`).join('<br>'):'<span class="muted">No recording registered yet — times only.</span>'}</td></tr></table>`).join('')};
boot();
</script></body></html>
