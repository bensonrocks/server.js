<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Liagire Workflow — Sign in</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card card">
    <div class="brand"><span style="color:var(--primary)">Liagire</span> Workflow</div>
    <div class="tag">Quote &rarr; collection &rarr; delivery &rarr; payment</div>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password" required />
      <div class="error-text" id="loginError"></div>
      <button type="submit" class="btn-primary btn-block" style="margin-top:14px;">Sign in</button>
    </form>
  </div>
</div>
<script>
const form = document.getElementById('loginForm');
const errEl = document.getElementById('loginError');
if (localStorage.getItem('liagire_token')) location.href = 'index.html';
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errEl.textContent = '';
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await res.json();
    if (!res.ok) { errEl.textContent = data.error || 'Sign-in failed'; return; }
    localStorage.setItem('liagire_token', data.token);
    localStorage.setItem('liagire_user', JSON.stringify(data.user));
    location.href = 'index.html';
  } catch (err) {
    errEl.textContent = 'Could not reach the server. Try again.';
  }
});
</script>
</body>
</html>
